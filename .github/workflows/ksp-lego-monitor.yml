name: KSP LEGO Monitor

on:
  workflow_dispatch:
  push:
    paths:
      - 'monitoring/ksp-lego-scraper.mjs'
      - 'package.json'
      - '.github/workflows/ksp-lego-monitor.yml'
  schedule:
    - cron: '55 7 * * *'
    - cron: '55 17 * * *'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Fetch KSP LEGO outlet
        env:
          FORCE_RUN: ${{ github.event_name != 'schedule' }}
        run: node monitoring/ksp-lego-scraper.mjs
      - name: Commit latest result
        run: |
          if [ ! -f monitoring/ksp-lego-latest.json ]; then
            echo "No result file generated"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitoring/ksp-lego-latest.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update KSP LEGO outlet snapshot"
            git push
          fi
